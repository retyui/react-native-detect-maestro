name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'package.json'                 # codegenConfig, peer deps, files
      - 'src/**'                       # JS / codegen spec
      - 'android/**'                   # Android native code
      - 'ios/**'                       # iOS native code
      - 'DetectMaestro.podspec'        # iOS (CocoaPods) build config
      - '.maestro/**'                  # e2e flows + test app entry (_App.js)
      - 'scripts/**'                   # e2e runner scripts
      - '.github/workflows/e2e.yaml'   # this workflow
      - '.github/actions/**'           # local actions used by this workflow

  push:
    branches:
      - main
    paths:
      - 'package.json'                 # codegenConfig, peer deps, files
      - 'src/**'                       # JS / codegen spec
      - 'android/**'                   # Android native code
      - 'ios/**'                       # iOS native code
      - 'DetectMaestro.podspec'        # iOS (CocoaPods) build config
      - '.maestro/**'                  # e2e flows + test app entry (_App.js)
      - 'scripts/**'                   # e2e runner scripts
      - '.github/workflows/e2e.yaml'   # this workflow
      - '.github/actions/**'           # local actions used by this workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_ARCH: x86_64
  E2E_RN_VER_TO_TEST: latest
  E2E_MAESTRO_VER: 2.13.0
  E2E_JAVA_VER: 17

jobs:
  build-android-e2e:
    name: Build e2e android.apk
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: retyui/oss-react-native-build/build-app@v0
        with:
          app-file: .maestro/_App.js
          platform: android
          store-artifacts: true
          android-arch: ${{ env.E2E_ARCH }}
          new-arch-enabled: 1
          rn-ver: ${{ env.E2E_RN_VER_TO_TEST }}
          module-to-install: ${{ github.workspace }}



  build-ios-e2e:
    name: Build e2e ios.app
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: retyui/oss-react-native-build/build-app@v0
        with:
          app-file: .maestro/_App.js
          platform: ios
          store-artifacts: true
          new-arch-enabled: 1
          rn-ver: ${{ env.E2E_RN_VER_TO_TEST }}
          module-to-install: ${{ github.workspace }}



  run-android-e2e:
    name: Run Android E2E
    runs-on: ubuntu-24.04  # Linux + KVM: hardware-accelerated x86_64 emulator
    needs: [build-android-e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-e2e
        with:
          platform: android
          maestro-version: ${{ env.E2E_MAESTRO_VER }}
          react-native-version: ${{ env.E2E_RN_VER_TO_TEST }}
          android-arch: ${{ env.E2E_ARCH }}
          java-version: ${{ env.E2E_JAVA_VER }}

  run_ios_e2e:
    name: Run iOS E2E
    runs-on: macos-15
    needs: [build-ios-e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-e2e
        with:
          platform: ios
          maestro-version: ${{ env.E2E_MAESTRO_VER }}
          react-native-version: ${{ env.E2E_RN_VER_TO_TEST }}
          java-version: ${{ env.E2E_JAVA_VER }}
