name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and create the GitHub release
  pull-requests: write # open the "chore: version packages" PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: 'true'

      # Tags are the plain version (e.g. "1.0.8", no "v" prefix) to match the existing tags.
      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          # Take the "## <version>" section from CHANGELOG.md
          awk -v header="## $VERSION" '$0 == header { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md

          if [ -n "$PREV_TAG" ]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$VERSION"
              echo
              echo "**npm diff**: https://npmfs.com/compare/$PKG_NAME/$PREV_TAG/$VERSION/"
            } >> release-notes.md
          fi

          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md
