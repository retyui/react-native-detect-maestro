name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - '**.md'                        # README, CHANGELOG, changesets
      - 'LICENSE'

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'                        # README, CHANGELOG, changesets
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-node-modules:
    name: Cache node_modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
        with:
          lookup-only: true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    needs: [cache-node-modules]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies

      - name: Types check
        run: yarn ts

      - name: Lib build
        run: yarn build

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rn_ver: [ latest ] # also, can be any npm tag: 0.71-stable, next, nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: retyui/oss-react-native-build/build-app@v0
        with:
          app-file: .maestro/_App.js
          android-arch: arm64-v8a
          rn-ver: ${{ matrix.rn_ver }}
          module-to-install: ${{ github.workspace }}
          store-artifacts: true
          platform: android

  build-ios-pods:
    name: Build iOS (CocoaPods)
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rn_ver: [ latest ] # also, can be any npm tag: 0.71-stable, next, nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: retyui/oss-react-native-build/build-app@v0
        with:
          app-file: .maestro/_App.js
          rn-ver: ${{ matrix.rn_ver }}
          module-to-install: ${{ github.workspace }}
          store-artifacts: true
          platform: ios

  build-ios-spm:
    name: Build iOS (SPM)
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rn_ver: [ latest ] # also, can be any npm tag: 0.71-stable, next, nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: retyui/oss-react-native-build/build-app@v0
        with:
          app-file: .maestro/_App.js
          rn-ver: ${{ matrix.rn_ver }}
          module-to-install: ${{ github.workspace }}
          store-artifacts: false
          platform: ios
          ios-package-manager: spm
