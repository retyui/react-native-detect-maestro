name: Run E2E
description: 'Set up your GitHub Actions workflow with a specific version of Node.js'
inputs:
  # Required parameters
  maestro-version:
    description: 'Version of Maestro (example: 1.34.1))'
    required: true

  react-native-version:
    description: 'React Native version as passed to build-app `rn-ver` (example: latest or 0.73)'
    required: true

  platform:
    description: 'Platform (example: android or ios))'
    required: true

  # Optional parameters
  java-version:
    description: 'The Java version to set up'
    required: false
    default: 11

  simulator-name:
    description: 'Simulator name (example: iPhone 16)'
    required: false
    default: iPhone 16

  android-arch:
    description: 'Android arch (example: arm64-v8a)'
    required: false
    default: x86_64

  android-api-level:
    description: 'Android Emulator API level (example: 31)'
    required: false
    default: 31


runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/run-ios-simulator
      if: ${{ inputs.platform == 'ios' }}
      with:
        simulator-name: ${{ inputs.simulator-name }}

    - uses: ./.github/actions/install-maestro
      with:
        maestro-version: ${{ inputs.maestro-version }}
        java-version: ${{ inputs.java-version }}
        platform: ${{ inputs.platform }}

    # Same naming as retyui/oss-react-native-build/build-app (new arch only: old arch is not supported on RN >= 0.82)
    - name: Resolve app names
      id: names
      shell: bash
      env:
        RN_VER: ${{ inputs.react-native-version }}
      run: |
        app_name="Example${RN_VER}1App"
        app_name="${app_name//[^a-zA-Z0-9]/}"
        echo "artifact=${{ inputs.platform }}-${RN_VER}-newArch-1" >> "$GITHUB_OUTPUT"
        echo "ios-app-id=org.reactjs.native.example.${app_name}" >> "$GITHUB_OUTPUT"
        echo "android-app-id=com.$(echo "$app_name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/run-ios-e2e
      if: ${{ inputs.platform == 'ios' }}
      with:
        download-artifact-name: ${{ steps.names.outputs.artifact }}
        app-id: ${{ steps.names.outputs.ios-app-id }}
        upload-artifact-name: e2e_ios_report-${{ inputs.maestro-version }}-new-arch

    - uses: ./.github/actions/run-android-e2e
      if: ${{ inputs.platform == 'android' }}
      with:
        arch: ${{ inputs.android-arch }}
        download-artifact-name: ${{ steps.names.outputs.artifact }}
        app-id: ${{ steps.names.outputs.android-app-id }}
        upload-artifact-name: e2e_android_report-${{ inputs.maestro-version }}-new-arch
        api-level: ${{ inputs.android-api-level }}
