name: Run iOS Simulator
description: Run iOS Simulator in background
inputs:
  simulator-name:
    description: 'Simulator name (example: iPhone 16)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run iOS Simulator
      shell: bash
      run: |
        # Device names change between runner images (e.g. "iPhone 14" is gone on macos-15): fall back to the first available iPhone
        udid=$(xcrun simctl list devices available -j | node -e '
          const name = process.argv[1];
          const all = Object.values(JSON.parse(require("fs").readFileSync(0)).devices).flat();
          const d = all.find(x => x.name === name) || all.find(x => x.name.startsWith("iPhone"));
          if (!d) process.exit(1);
          if (d.name !== name) console.error(`"${name}" not found, using "${d.name}"`);
          console.log(d.udid);
        ' "${{ inputs.simulator-name }}")
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

        # Boot in the background so it overlaps with Java/Maestro setup;
        # run-ios-e2e waits for it (`simctl bootstatus`) before installing the app
        nohup xcrun simctl bootstatus "$udid" -b > simulator_boot.log 2>&1 &
